name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          pip install -r requirements_test.txt
          # Requirements of HA's bluetooth/usb components, matched to the installed HA version
          pip install $(python - <<'EOF'
          import json, pathlib, homeassistant
          base = pathlib.Path(homeassistant.__file__).parent / "components"
          reqs = []
          for comp in ("bluetooth", "usb"):
              reqs += json.loads((base / comp / "manifest.json").read_text())["requirements"]
          print(" ".join(reqs))
          EOF
          )
      - name: Run pytest
        run: |
          set -o pipefail
          pytest -ra 2>&1 | tee pytest.log
      - name: Publish pytest output as annotation
        if: failure()
        run: |
          # Annotations are readable without signing in, unlike job logs.
          tail -n 80 pytest.log | python -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'); print('::error title=pytest output::' + t)"
